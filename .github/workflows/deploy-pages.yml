name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Generate Quantum Numbers
    types:
      - completed

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - uses: actions/deploy-pages@v5