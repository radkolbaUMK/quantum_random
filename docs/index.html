<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Quantum Random Generator">
    <title>Quantum Random Generator</title>
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Quantum Random Number Generator</h1>
        <h3>Zakres</h3>
        <div class="range-container">
            <label for="minValue">Od:</label>
            <input id="minValue" type="number" value="1">
            <label for="maxValue">Do:</label>
            <input id="maxValue" type="number" value="100">
        </div>
        <h3>Uczestnicy</h3>
        <textarea id="participants" rows="10" placeholder="Jedna osoba w linii"></textarea>
        <div id="result">?</div>
        <button id="drawBtn">Losuj liczbę</button>
        <div id="details"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
